<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard • ภารกิจนักเรียนรู้</title>
<style>body{font-family:system-ui,"Noto Sans Thai";margin:0;background:#fff7ed;color:#2b2118}.wrap{max-width:1200px;margin:auto;padding:20px}.hero,.card{background:#fff;border-radius:22px;padding:22px;margin-bottom:18px;box-shadow:0 8px 24px #7c2d1218}.hero{background:linear-gradient(135deg,#7c2d12,#ea580c);color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.kpi{padding:18px;border-radius:16px;background:#fff7ed}.num{font-size:34px;font-weight:900;color:#ea580c}input,button{padding:12px;border-radius:12px;border:2px solid #fed7aa}button{background:#ea580c;color:#fff;font-weight:800;border:0}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #fed7aa;text-align:left} .small{font-size:13px}</style></head><body><div class="wrap"><div class="hero"><h1>📊 Dashboard • ภารกิจนักเรียนรู้</h1><p>สำหรับครู/ผู้ดูแลระบบ</p></div><div class="card"><div class="grid"><div><b>Web App URL</b><input id="api" value="https://script.google.com/macros/s/AKfycbyVaulBJqyuBEiPfAB62eypHKyR271JhZ1YJKImo9yqFLqlQkk99bxNRE_pLCuWGa-UDA/exec" readonly style="width:100%"></div><div><b>รหัสครู</b><input id="pin" type="password" style="width:100%" placeholder="PIN"></div></div><br><button onclick="load()">โหลดข้อมูล</button></div><div id="kpi" class="grid"></div><div class="card"><h2>คำตอบล่าสุด</h2><div style="overflow:auto"><table><thead><tr><th>เวลา</th><th>ผู้เรียน</th><th>สกร.ระดับตำบล</th><th>ภารกิจ</th><th>คำตอบ</th><th>XP</th></tr></thead><tbody id="rows"></tbody></table></div></div></div>
<script>
async function load(){let u=document.getElementById("api").value.trim(),p=document.getElementById("pin").value;if(!u||!p)return alert("กรุณากรอก URL และ PIN");let r=await fetch(u+"?action=list&pin="+encodeURIComponent(p));let j=await r.json();if(!j.ok)return alert(j.error||"ไม่สามารถโหลดข้อมูล");let d=j.data||[];document.getElementById("kpi").innerHTML=[["ผู้เรียน",new Set(d.map(x=>x.name)).size],["คำตอบ",d.length],["XP รวม",d.reduce((s,x)=>s+Number(x.xp||0),0)],["ภารกิจครบ",d.filter(x=>Number(x.total||0)>=5).length]].map(x=>`<div class="kpi"><div>${x[0]}</div><div class="num">${x[1]}</div></div>`).join("");document.getElementById("rows").innerHTML=d.slice().reverse().map(x=>`<tr><td>${x.timestamp||""}</td><td>${esc(x.name)}</td><td>${esc(x.tambon)}</td><td>${esc(x.quest)}</td><td>${esc(x.answer)}</td><td>${x.xp||0}</td></tr>`).join("")}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
</script></body></html>
